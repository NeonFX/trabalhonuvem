services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./web/app.js:/usr/share/nginx/html/app.js:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
  api:
    build: ./backend
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://monitor:${POSTGRES_PASSWORD:-monitor_local}@db:5432/monitor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
    networks: [frontend, data]
  worker:
    build: ./backend
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://monitor:${POSTGRES_PASSWORD:-monitor_local}@db:5432/monitor
      CHECK_INTERVAL: "15"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [frontend, data]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor_local}
    volumes:
      - monitor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [data]
networks:
  frontend:
  data:
    internal: true
volumes:
  monitor_data:
